[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meltdown-terminal"
dynamic = ["version"]
description = "A stressful, fast-typing survival game that runs entirely in your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "Chirag Bhandarkar" },
]
keywords = ["terminal", "game", "curses", "typing", "cli", "survival"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]
dependencies = [
    "windows-curses>=2.3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
meltdown = "meltdown.cli:main"

[project.urls]
Homepage = "https://github.com/codest0411/meltdown"
Repository = "https://github.com/codest0411/meltdown"
Issues = "https://github.com/codest0411/meltdown/issues"
Changelog = "https://github.com/codest0411/meltdown/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "meltdown.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
